name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ── Staging: GitHub Pages (baco287.github.io/Zulassungsdienst) ──────────
  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Build (mit basePath für github.io-Unterpfad)
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /Zulassungsdienst

      - name: Auf gh-pages-Branch veröffentlichen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out

  # ── Produktion: all-inkl Webspace (deutschezulassung.de) ────────────────
  # Läuft erst, wenn die Secrets FTP_SERVER / FTP_USERNAME / FTP_PASSWORD
  # im Repo hinterlegt sind (Settings → Secrets and variables → Actions).
  deploy-allinkl:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_FTP != ''

      - uses: actions/setup-node@v4
        if: env.HAS_FTP != ''
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        if: env.HAS_FTP != ''
        run: npm ci

      - name: Build (Root-Pfad für eigene Domain)
        if: env.HAS_FTP != ''
        run: npm run build

      # lftp statt FTP-Deploy-Action: umgeht den bekannten
      # "tlsv1 alert decode error" (TLS-Session-Reuse) mit kasserver-FTPS.
      - name: Per FTPS zu all-inkl deployen (lftp)
        if: env.HAS_FTP != ''
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          # Hauptnutzer wurzelt auf "/" – Website liegt im Domain-Ordner.
          # --delete hält das Zielverzeichnis exakt synchron zum Build.
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set net:max-retries 3;
            set net:timeout 30;
            mirror -R --delete --parallel=4 --verbose=1 ./out/ /deutschezulassung.de/;
            bye
          " "$FTP_SERVER"
