name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ── Staging: GitHub Pages (baco287.github.io/Zulassungsdienst) ──────────
  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Build (mit basePath für github.io-Unterpfad)
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /Zulassungsdienst

      - name: Auf gh-pages-Branch veröffentlichen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out

  # ── Produktion: all-inkl Webspace (deutschezulassung.de) ────────────────
  # Läuft erst, wenn die Secrets FTP_SERVER / FTP_USERNAME / FTP_PASSWORD
  # im Repo hinterlegt sind (Settings → Secrets and variables → Actions).
  deploy-allinkl:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_FTP != ''

      - uses: actions/setup-node@v4
        if: env.HAS_FTP != ''
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        if: env.HAS_FTP != ''
        run: npm ci

      - name: Build (Root-Pfad für eigene Domain)
        if: env.HAS_FTP != ''
        run: npm run build

      - name: Per FTP zu all-inkl deployen
        if: env.HAS_FTP != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/' }}
