name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ── Staging: GitHub Pages (baco287.github.io/Zulassungsdienst) ──────────
  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Build (mit basePath für github.io-Unterpfad)
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /Zulassungsdienst

      - name: Auf gh-pages-Branch veröffentlichen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out

  # ── Produktion: all-inkl Webspace (deutschezulassung.de) ────────────────
  # Läuft erst, wenn die Secrets FTP_SERVER / FTP_USERNAME / FTP_PASSWORD
  # im Repo hinterlegt sind (Settings → Secrets and variables → Actions).
  deploy-allinkl:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_FTP != ''

      - uses: actions/setup-node@v4
        if: env.HAS_FTP != ''
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        if: env.HAS_FTP != ''
        run: npm ci

      - name: Build (Root-Pfad für eigene Domain)
        if: env.HAS_FTP != ''
        run: npm run build

      - name: Secrets auf Vollständigkeit prüfen
        if: env.HAS_FTP != ''
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          MISSING=""
          [ -z "$FTP_SERVER" ] && MISSING="$MISSING FTP_SERVER"
          [ -z "$FTP_USERNAME" ] && MISSING="$MISSING FTP_USERNAME"
          [ -z "$FTP_PASSWORD" ] && MISSING="$MISSING FTP_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "FEHLENDE ODER LEERE SECRETS:$MISSING" | tee /tmp/lftp.log
            exit 1
          fi
          echo "Alle drei Secrets vorhanden." | tee /tmp/lftp.log

      # lftp statt FTP-Deploy-Action: umgeht den bekannten
      # "tlsv1 alert decode error" (TLS-Session-Reuse) mit kasserver-FTPS.
      - name: Per FTPS zu all-inkl deployen (lftp)
        if: env.HAS_FTP != ''
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          # Hauptnutzer wurzelt auf "/" – Website liegt im Domain-Ordner.
          # --delete hält das Zielverzeichnis exakt synchron zum Build.
          lftp -d -u "$FTP_USERNAME","$FTP_PASSWORD" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set ssl:priority 'NORMAL:-VERS-TLS1.3';
            set ftp:passive-mode true;
            set net:max-retries 3;
            set net:timeout 60;
            set net:reconnect-interval-base 5;
            mirror -R --delete --verbose=1 ./out/ /deutschezulassung.de/;
            bye
          " "$FTP_SERVER" 2>&1 | tee /tmp/lftp.log

      # Bei Fehlschlag: geschwärztes Log auf Branch "deploy-logs" ablegen,
      # damit die Diagnose ohne Actions-UI-Zugriff möglich ist.
      - name: Fehlerlog veröffentlichen (Branch deploy-logs)
        if: failure() && env.HAS_FTP != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PYEOF'
          import os
          text = open('/tmp/lftp.log', encoding='utf-8', errors='replace').read()
          for key in ('FTP_PASSWORD', 'FTP_USERNAME', 'FTP_SERVER'):
              val = os.environ.get(key, '')
              if val:
                  text = text.replace(val, f'<{key}>')
          lines = text.splitlines()[-250:]
          open('/tmp/lftp-redacted.log', 'w', encoding='utf-8').write('\n'.join(lines))
          PYEOF
          B64=$(base64 -w0 /tmp/lftp-redacted.log)
          SHA=$(git rev-parse HEAD)
          REPO="${{ github.repository }}"
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -d "{\"ref\":\"refs/heads/deploy-logs\",\"sha\":\"$SHA\"}" \
            "https://api.github.com/repos/$REPO/git/refs" > /dev/null || true
          FSHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/contents/lftp-fehler.log?ref=deploy-logs" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('sha','') if isinstance(d,dict) else '')")
          PAYLOAD="{\"message\":\"lftp-Fehlerlog (automatisch)\",\"content\":\"$B64\",\"branch\":\"deploy-logs\""
          [ -n "$FSHA" ] && PAYLOAD="$PAYLOAD,\"sha\":\"$FSHA\""
          PAYLOAD="$PAYLOAD}"
          curl -s -X PUT -H "Authorization: Bearer $GH_TOKEN" -d "$PAYLOAD" \
            "https://api.github.com/repos/$REPO/contents/lftp-fehler.log" > /dev/null
