name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ── Staging: GitHub Pages (baco287.github.io/Zulassungsdienst) ──────────
  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Build (mit basePath für github.io-Unterpfad)
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /Zulassungsdienst
          NEXT_PUBLIC_STAGING: "1" 

      - name: Preise im Build prüfen (Staging, ohne Freigabe-Pflicht)
        run: node scripts/check-preise.mjs --out

      - name: Auf gh-pages-Branch veröffentlichen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out

  # ── Produktion: all-inkl Webspace (kfz-zulassungsprofis.de) ─────────────
  # Läuft erst, wenn die Secrets FTP_SERVER / FTP_USERNAME / FTP_PASSWORD
  # im Repo hinterlegt sind (Settings → Secrets and variables → Actions).
  #
  # Domainumzug: config/migration.json steuert, was hochgeladen wird.
  #   "vorschau"  neue Website in den Ordner der neuen Domain, mit noindex;
  #               der Ordner der alten Domain wird nicht angefasst.
  #   "live"      neue Website indexierbar; zusätzlich kommt die
  #               Weiterleitungs-.htaccess (deploy/alte-domain/) in den Ordner
  #               der alten Domain. Dort wird nichts gelöscht.
  deploy-allinkl:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_FTP != ''

      - uses: actions/setup-node@v4
        if: env.HAS_FTP != ''
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        if: env.HAS_FTP != ''
        run: npm ci

      # Liest Stufe und Zielordner und bricht bei unplausiblen Werten ab –
      # ein leerer oder falscher Ordner darf nie zu einem Upload ins Wurzel-
      # verzeichnis des Webspace führen.
      - name: Migrationsstufe lesen
        id: mig
        if: env.HAS_FTP != ''
        run: |
          set -o pipefail
          node -e '
            const m = require("./config/migration.json");
            const ordner = /^\/[a-z0-9-]+(\.[a-z0-9-]+)+$/;
            if (!["vorschau", "live"].includes(m.stufe)) throw new Error("config/migration.json: stufe muss vorschau oder live sein");
            for (const k of ["neu", "alt"]) {
              if (!ordner.test(m[k].ftpOrdner)) throw new Error("config/migration.json: ftpOrdner ungültig bei " + k);
            }
            if (m.neu.ftpOrdner === m.alt.ftpOrdner) throw new Error("config/migration.json: neuer und alter Ordner sind identisch");
            console.log("stufe=" + m.stufe);
            console.log("neu=" + m.neu.ftpOrdner);
            console.log("alt=" + m.alt.ftpOrdner);
          ' | tee -a "$GITHUB_OUTPUT"

      - name: Build (Root-Pfad für eigene Domain)
        if: env.HAS_FTP != ''
        run: npm run build
        env:
          # Vorschau: Seiten tragen noindex, das Formular funktioniert trotzdem.
          NEXT_PUBLIC_NOINDEX: ${{ steps.mig.outputs.stufe == 'live' && '0' || '1' }}

      # Zugangsdaten für den Mailversand des Formulars (public/api/auftrag.php).
      # Nur in diesem Job, nie im GitHub-Pages-Build – sonst wären sie öffentlich.
      # Fehlen die Secrets, meldet das Formular ehrlich „nicht zugestellt“.
      - name: Mailzugang für das Formular ablegen
        if: env.HAS_FTP != ''
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: node scripts/mail-zugang.mjs out/api/mail-zugang.php

      # Login für das Analytics-Dashboard (https://kfz-zulassungsprofis.de/analytics/).
      # Ohne Secrets bleibt das Dashboard gesperrt; die Erfassung der Besuche läuft trotzdem.
      - name: Zugang zum Analytics-Dashboard ablegen
        if: env.HAS_FTP != ''
        env:
          ANALYTICS_USER: ${{ secrets.ANALYTICS_USER }}
          ANALYTICS_PASSWORD: ${{ secrets.ANALYTICS_PASSWORD }}
        run: node scripts/analytics-zugang.mjs out/api/analytics-zugang.php

      # API-Schlüssel für die KI-Ideen des Kennzeichenassistenten (api/kennzeichen-ki.php).
      # Ohne Secret läuft der Assistent weiter – nur mit dem Generator im Browser, ohne KI.
      - name: KI-Zugang für den Kennzeichenassistenten ablegen
        if: env.HAS_FTP != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/ki-zugang.mjs out/api/ki-zugang.php

      # Weiterleitungen der alten Domain müssen zu den Seiten im Build passen.
      - name: Weiterleitungsregeln prüfen
        if: env.HAS_FTP != ''
        run: node scripts/check-weiterleitungen.mjs --regeln

      # Bricht ab, wenn Altpreise im Build stehen oder die Preise in
      # config/preise.json nicht freigegeben sind (freigabe.freigegeben).
      - name: Preise prüfen und Freigabe verlangen
        if: env.HAS_FTP != ''
        run: |
          set -o pipefail
          node scripts/check-preise.mjs --out --freigabe 2>&1 | tee /tmp/lftp.log

      - name: Secrets auf Vollständigkeit prüfen
        if: env.HAS_FTP != ''
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          MISSING=""
          [ -z "$FTP_SERVER" ] && MISSING="$MISSING FTP_SERVER"
          [ -z "$FTP_USERNAME" ] && MISSING="$MISSING FTP_USERNAME"
          [ -z "$FTP_PASSWORD" ] && MISSING="$MISSING FTP_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "FEHLENDE ODER LEERE SECRETS:$MISSING" | tee /tmp/lftp.log
            exit 1
          fi
          echo "Alle drei Secrets vorhanden." | tee /tmp/lftp.log

      # lftp statt FTP-Deploy-Action: umgeht den bekannten
      # "tlsv1 alert decode error" (TLS-Session-Reuse) mit kasserver-FTPS.
      #
      # Drei Mirror-Laeufe gegen das "unstyled window": Jeder Build erzeugt neue
      # CSS-/JS-Hashes; wuerde das HTML vor den Assets landen, zeigt die Seite
      # minutenlang keine Styles. Daher: (1) neue Assets zuerst hochladen (ohne
      # Loeschen - alte bleiben fuer noch ausgeliefertes altes HTML verfuegbar),
      # (2) HTML & Rest spiegeln, (3) erst zum Schluss verwaiste Assets loeschen.
      # --parallel=6: seit dem Zulassungsstellen-Ausbau (>1.300 Seiten) dauerte der
      # serielle Upload ueber eine Stunde; parallele Verbindungen verkuerzen das deutlich.
      - name: Per FTPS zu all-inkl deployen (lftp)
        if: env.HAS_FTP != ''
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          STUFE: ${{ steps.mig.outputs.stufe }}
          NEU_ORDNER: ${{ steps.mig.outputs.neu }}
          ALT_ORDNER: ${{ steps.mig.outputs.alt }}
        run: |
          set -o pipefail
          [ -n "$NEU_ORDNER" ] && [ -n "$ALT_ORDNER" ] || { echo "Zielordner fehlen" | tee /tmp/lftp.log; exit 1; }
          # Alte Domain: nur im Livegang, nur die Weiterleitungs-.htaccess, ohne --delete.
          ALT_BEFEHL=""
          if [ "$STUFE" = "live" ]; then
            ALT_BEFEHL="mirror -R --verbose=1 ./deploy/alte-domain/ $ALT_ORDNER/;"
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          # Diagnose-Proben vor dem eigentlichen Deploy:
          {
            echo "== lftp-Version =="; lftp --version | head -1
            echo "== DNS =="; getent hosts "$FTP_SERVER" || echo "DNS-AUFLOESUNG FEHLGESCHLAGEN"
            echo "== TLS-Probe (curl, ohne Login-Erwartung) =="
            curl -sv --max-time 20 --ssl-reqd "ftp://$FTP_SERVER/" 2>&1 | tail -25 || true
            echo "== lftp-Lauf =="
          } > /tmp/lftp.log
          # Zugangsdaten via ~/.netrc – lftp nutzt sie beim open automatisch
          # (robust gegen Sonderzeichen; -u griff beim open im Skript nicht).
          printf 'machine %s\nlogin %s\npassword %s\n' \
            "$FTP_SERVER" "$FTP_USERNAME" "$FTP_PASSWORD" > ~/.netrc
          chmod 600 ~/.netrc
          # Hauptnutzer wurzelt auf "/" – Website liegt im Domain-Ordner.
          echo "Stufe: $STUFE · Ziel: $NEU_ORDNER · alte Domain: ${ALT_BEFEHL:-unverändert}" | tee -a /tmp/lftp.log
          lftp -d -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set ftp:passive-mode true;
            set net:max-retries 2;
            set net:timeout 60;
            open $FTP_SERVER;
            pwd;
            mirror -R --parallel=6 --verbose=1 ./out/_next/ $NEU_ORDNER/_next/;
            mirror -R --parallel=6 --delete --verbose=1 --exclude ^_next/ ./out/ $NEU_ORDNER/;
            mirror -R --parallel=6 --delete --verbose=1 ./out/_next/ $NEU_ORDNER/_next/;
            $ALT_BEFEHL
            bye
          " 2>&1 | tee -a /tmp/lftp.log
          rm -f ~/.netrc

      # Bei Fehlschlag: geschwärztes Log auf Branch "deploy-logs" ablegen,
      # damit die Diagnose ohne Actions-UI-Zugriff möglich ist.
      - name: Fehlerlog veröffentlichen (Branch deploy-logs)
        if: failure() && env.HAS_FTP != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          [ -f /tmp/lftp.log ] || echo 'Kein lftp.log – Fehler vor dem Deploy (Build oder Preisprüfung), siehe Actions-Log.' > /tmp/lftp.log
          python3 - <<'PYEOF'
          import os
          text = open('/tmp/lftp.log', encoding='utf-8', errors='replace').read()
          for key in ('FTP_PASSWORD', 'FTP_USERNAME', 'FTP_SERVER', 'SMTP_PASSWORD'):
              val = os.environ.get(key, '')
              if val:
                  text = text.replace(val, f'<{key}>')
          lines = text.splitlines()[-250:]
          open('/tmp/lftp-redacted.log', 'w', encoding='utf-8').write('\n'.join(lines))
          PYEOF
          B64=$(base64 -w0 /tmp/lftp-redacted.log)
          SHA=$(git rev-parse HEAD)
          REPO="${{ github.repository }}"
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -d "{\"ref\":\"refs/heads/deploy-logs\",\"sha\":\"$SHA\"}" \
            "https://api.github.com/repos/$REPO/git/refs" > /dev/null || true
          FSHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/contents/lftp-fehler.log?ref=deploy-logs" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('sha','') if isinstance(d,dict) else '')")
          PAYLOAD="{\"message\":\"lftp-Fehlerlog (automatisch)\",\"content\":\"$B64\",\"branch\":\"deploy-logs\""
          [ -n "$FSHA" ] && PAYLOAD="$PAYLOAD,\"sha\":\"$FSHA\""
          PAYLOAD="$PAYLOAD}"
          curl -s -X PUT -H "Authorization: Bearer $GH_TOKEN" -d "$PAYLOAD" \
            "https://api.github.com/repos/$REPO/contents/lftp-fehler.log" > /dev/null
